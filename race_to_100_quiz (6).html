const R=[['I have cities but no houses, forests but no trees, and water but no fish. What am I?','map'],['What has hands but cannot clap?','clock'],['The more you take, the more you leave behind. What are they?','footsteps']];
let state={players:[],turn:0,score:[],roll:null,qs:[],qi:0,correct:0,wrong:0,locked:false,riddle:null,used:new Set(),lastCategory:null,riddleDone:[],riddleResolved:false};
function setup(){app.innerHTML=`<div class='screen setup'><div class='card'><div style='font-size:52px'>🏁</div><h1>RACE TO 100</h1><p class='small'>General Knowledge • Pressure • Strategy • First to 100 wins</p><h2>How many players?</h2><div class='choices'>${[2,3,4].map(n=>`<button class='choice' onclick='names(${n})'>${n} Players</button>`).join('')}</div></div></div>`}
function names(n){app.innerHTML=`<div class='screen setup'><div class='card'><h1>PLAYER SETUP</h1><p class='small'>Choose a name for each player.</p><div class='names'>${Array.from({length:n},(_,i)=>`<input id='n${i}' placeholder='Player ${i+1}' value='Player ${i+1}'>`).join('')}</div><button class='primary' onclick='start(${n})'>START GAME →</button></div></div>`}
function start(n){state.players=Array.from({length:n},(_,i)=>document.getElementById('n'+i).value.trim()||`Player ${i+1}`);state.score=Array(n).fill(0);state.turn=0;state.used=new Set();state.lastCategory=null;state.riddleDone=Array.from({length:n},()=>new Set());state.riddleResolved=false;renderGame()}
function renderGame(){app.innerHTML=`<div class='screen'><div class='game'><div class='top'><div class='title'>🏁 RACE TO 100</div><div class='turn'>Turn: <b id='turnName'></b></div></div><div class='columns' style='--players:${state.players.length}'>${state.players.map((p,i)=>lane(i,p)).join('')}</div><div class='console'><div class='dicebox'><div id='activeAvatar' class='avatar' style='font-size:55px'></div><h2 id='activeName'></h2><div class='dice' id='dice'>🎲</div><button id='rollBtn' class='roll' onclick='rollDice()'>ROLL DICE</button><div class='rules'>Roll the dice. Answer that many questions.<br><br><b>${Q.length} built-in questions</b> across 14 categories; no repeats until the bank is exhausted.<br><br>All correct = +1 bonus space<br>No correct = −3 spaces<br>After 50, each wrong answer = −1 space</div></div><div class='qbox' id='qbox'><h2>Ready?</h2><p class='small'>Roll the dice to start your turn.</p></div></div><div id='winner'></div></div></div>`;updateLanes();setActive()}
function lane(i,p){let cells='';for(let x=1;x<=100;x++){let c=x<=25?'red':x<=50?'orange':x<=75?'yellow':'green';cells+=`<div id='c-${i}-${x}' class='cell ${c}'></div>`}return `<div class='lane' id='lane-${i}'><div class='lanehead'><span class='avatar'>${['🧑‍🚀','🦊','🐼','🦁'][i]}</span><span class='pname'>${esc(p)}</span><span class='score' id='score-${i}'>0</span></div><div class='track'>${cells}</div></div>`}
function updateLanes(){state.score.forEach((s,i)=>{document.getElementById('score-'+i).textContent=s;for(let x=1;x<=100;x++){let el=document.getElementById(`c-${i}-${x}`);el.classList.toggle('lit',x<=s);el.classList.toggle('current',x===s&&s>0)}})}
function setActive(){document.querySelectorAll('.lane').forEach((e,i)=>e.classList.toggle('active',i===state.turn));document.getElementById('turnName').textContent=state.players[state.turn];document.getElementById('activeName').textContent=state.players[state.turn];document.getElementById('activeAvatar').textContent=['🧑‍🚀','🦊','🐼','🦁'][state.turn]}
function rollDice(){if(state.locked)return;let d=Math.floor(Math.random()*6)+1;state.roll=d;state.qi=0;state.correct=0;state.wrong=0;document.getElementById('dice').textContent=['⚀','⚁','⚂','⚃','⚄','⚅'][d-1];document.getElementById('rollBtn').disabled=true;state.qs=[];for(let i=0;i<d;i++){let band=state.score[state.turn]<25?'easy':state.score[state.turn]<50?'medium':state.score[state.turn]<75?'hard':'hard';let pool=Q.filter((q,idx)=>!state.used.has(idx)&&q[1]===band&&q[0]!==state.lastCategory);if(!pool.length)pool=Q.filter((q,idx)=>!state.used.has(idx)&&q[0]!==state.lastCategory);if(!pool.length)pool=Q.filter((q,idx)=>!state.used.has(idx));if(!pool.length){state.used.clear();pool=Q.filter(q=>q[0]!==state.lastCategory);if(!pool.length)pool=Q.slice()}let q=pool[Math.floor(Math.random()*pool.length)],idx=Q.indexOf(q);state.used.add(idx);state.lastCategory=q[0];state.qs.push(q)}showQuestion()}
let timer;
function showQuestion(){clearInterval(timer);if(state.qi>=state.qs.length){finishTurn();return}let q=state.qs[state.qi],left=10;state.locked=false;document.getElementById('qbox').innerHTML=`<div class='meta'><span class='tag'>${q[0]}</span><span class='tag'>${q[1].toUpperCase()}</span><span>Question ${state.qi+1} of ${state.roll}</span><span class='timer' id='timer'>10</span></div><div class='question'>${q[2]}</div><div class='answers'>${q[3].map((a,i)=>`<button class='answer' onclick='answer(${i})'>${a}</button>`).join('')}</div><div class='feedback' id='feedback'></div>`;timer=setInterval(()=>{left--;document.getElementById('timer').textContent=left;if(left<=0){clearInterval(timer);answer(-1)}},1000)}
function answer(i){if(state.locked)return;state.locked=true;clearInterval(timer);let q=state.qs[state.qi],ok=i===q[4];if(ok)state.correct++;else state.wrong++;document.querySelectorAll('.answer').forEach((b,k)=>{b.disabled=true;if(k===q[4])b.classList.add('correct');if(k===i&&!ok)b.classList.add('wrong')});document.getElementById('feedback').textContent=i===-1?'TIME!':ok?'CORRECT!':'WRONG!';setTimeout(()=>{state.qi++;showQuestion()},650)}
function finishTurn(){let delta=state.correct===state.roll?1:state.correct===0?-3:0;if(state.score[state.turn]>=50)delta-=state.wrong;let old=state.score[state.turn],next=Math.max(0,Math.min(100,old+state.correct+delta));state.score[state.turn]=next;updateLanes();if(next>=100){document.getElementById('winner').innerHTML=`<div class='winner'>🏆 ${esc(state.players[state.turn])} WINS! 🏆</div>`;document.getElementById('rollBtn').disabled=true;document.getElementById('winner').innerHTML+=`<p><button class='primary' onclick='setup()'>NEW GAME</button></p>`;return}let crossed=[25,50,75].find(x=>old<x&&next>=x&&!state.riddleDone[state.turn].has(x));if(crossed){state.riddleDone[state.turn].add(crossed);showRiddle(crossed);return}document.getElementById('qbox').innerHTML=`<h2>Turn complete</h2><p class='small'>${state.correct}/${state.roll} correct. Moving to the next player…</p>`;setTimeout(nextTurn,900)}
function showRiddle(mark){state.riddleResolved=false;let r=R[Math.floor(Math.random()*R.length)];let left=180;document.getElementById('qbox').innerHTML=`<div class='riddle'><div class='meta'><span class='tag'>RIDDLE CHECKPOINT — ${mark}</span><span class='timer' id='rtimer'>180</span></div><h2>${r[0]}</h2><input id='rinput' placeholder='Type your answer…' autocomplete='off'><button class='primary' onclick='submitRiddle()'>SUBMIT ANSWER</button><div class='feedback' id='rfeed'></div></div>`;state.riddle=r;timer=setInterval(()=>{left--;document.getElementById('rtimer').textContent=left;if(left<=0){clearInterval(timer);riddleResult(false)}},1000)}
function submitRiddle(){if(state.riddleResolved)return;let a=document.getElementById('rinput').value.trim().toLowerCase();riddleResult(a===state.riddle[1])}function riddleResult(ok){if(state.riddleResolved)return;state.riddleResolved=true;clearInterval(timer);let f=document.getElementById('rfeed');f.textContent=ok?'RIDDLE SOLVED!':'RIDDLE FAILED — BACK 5';if(!ok)state.score[state.turn]=Math.max(0,state.score[state.turn]-5);updateLanes();setTimeout(nextTurn,900)}
function nextTurn(){state.turn=(state.turn+1)%state.players.length;state.roll=null;state.locked=false;setActive();document.getElementById('rollBtn').disabled=false;document.getElementById('dice').textContent='🎲';document.getElementById('qbox').innerHTML=`<h2>${esc(state.players[state.turn])}'s turn</h2><p class='small'>Roll the dice to begin.</p>`}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}setup();
</script></body></html>
